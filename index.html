<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<title>研究英会話トレーナー</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#22314E">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap');
:root{
  --navy:#22314E; --navy-deep:#182338; --bg:#F2F3F0; --paper:#FFFFFF;
  --line:#DCDFE3; --ink:#222733; --sub:#646B78; --stripe:#B94A2F;
  --amber-bg:#FAF1DC; --amber-line:#E3C883; --amber-ink:#6E5414;
  --green:#2E7D4F; --green-bg:#E9F3EC; --red-bg:#FBEDEA; --red-line:#E5B3A6; --red-ink:#8C3A26;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN',sans-serif;
  background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.4;cursor:default}
textarea,input{font-family:inherit}
.display{font-family:'Archivo','Zen Kaku Gothic New',sans-serif}
.mono{font-family:'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.wrap{max-width:600px;margin:0 auto;padding:0 20px}
.eyebrow{font-size:10px;font-weight:500;color:var(--sub)}
.eyebrow.red{color:var(--stripe)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px;border-radius:12px;font-weight:700;font-size:14px}
.btn-navy{background:var(--navy);color:#fff}
.btn-stripe{background:var(--stripe);color:#fff}
.btn-ghost{background:var(--paper);border:1px solid var(--line);color:var(--sub)}
.errbox{background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);border-radius:12px;padding:12px 16px;font-size:13px}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.msg{animation:fadeUp .3s ease both}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.dot{width:8px;height:8px;border-radius:50%;background:var(--sub);display:inline-block;animation:blink 1.2s infinite}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(185,74,47,.45)}70%{box-shadow:0 0 0 12px rgba(185,74,47,0)}100%{box-shadow:0 0 0 0 rgba(185,74,47,0)}}
.listening{animation:pulse 1.4s infinite}
@media (prefers-reduced-motion:reduce){.msg,.dot,.listening{animation:none!important}}
#msgScroll::-webkit-scrollbar{width:6px}
#msgScroll::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px}

/* chat layout */
.chat-root{display:flex;flex-direction:column;height:100dvh}
.chat-head{flex-shrink:0;background:var(--navy);border-bottom:1px solid var(--navy-deep);padding:12px 16px}
.chat-body{flex:1;overflow-y:auto}
.chat-foot{flex-shrink:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px 16px}
.avatar{flex-shrink:0;width:32px;height:32px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;font-family:'Archivo',sans-serif}
.bub-ai{background:var(--paper);border:1px solid var(--line);border-radius:16px 16px 16px 6px;padding:11px 16px;font-size:14px;line-height:1.65}
.bub-user{background:var(--navy);color:#fff;border-radius:16px 16px 6px 16px;padding:11px 16px;font-size:14px;line-height:1.65;max-width:82%}
.fbcard{max-width:82%;margin-top:8px;background:var(--amber-bg);border:1px solid var(--amber-line);border-radius:12px;padding:10px 14px;text-align:left}
.pill{font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--sub);background:transparent}
.pill.on{background:var(--navy);border-color:var(--navy);color:#fff}
.iconbtn{flex-shrink:0;width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:17px}
.scene-btn{width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 16px;margin-bottom:8px}
.scene-btn.on{background:var(--navy);border-color:var(--navy)}
.diff-btn{flex:1;border:1px solid var(--line);background:var(--paper);color:var(--sub);border-radius:12px;padding:9px 0;font-weight:700;font-size:14px}
.diff-btn.on{background:var(--navy);border-color:var(--navy);color:#fff}
.hintbtn{width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 12px;margin-top:8px}
.book-link{display:inline-flex;align-items:center;justify-content:center;gap:5px;min-height:44px;padding:7px 11px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--navy);font-size:12px;font-weight:700;white-space:nowrap}
.book-link.dark{border-color:#63708A;background:rgba(255,255,255,.08);color:#fff}
.small-action{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--navy);font-size:12px;font-weight:700;white-space:nowrap}
.small-action.saved{border-color:#BCD9C6;background:var(--green-bg);color:var(--green)}
.phrase-row{display:flex;gap:10px;align-items:flex-start;padding-top:12px}
.phrase-copy{min-width:0;flex:1}
[lang="en"]{overflow-wrap:anywhere;word-break:break-word}
.phrase-actions{display:flex;gap:6px;align-items:center;flex-shrink:0}
.phrase-notice{min-height:20px;margin-top:8px;font-size:12px;font-weight:700;color:var(--green)}
.phrase-notice.error{color:var(--red-ink)}
.phrase-empty{font-size:12px;line-height:1.7;color:var(--sub);margin-top:8px}
.backup-card{background:#F7FAFF;border:1px solid #C8D6EC;border-radius:16px;padding:16px;margin-top:14px}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.review-card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.mastery-field{border:0;border-top:1px solid var(--line);margin-top:12px;padding-top:11px}
.mastery-field legend{padding:0 7px 0 0;font-size:10px;font-weight:700;color:#7B8390}
.mastery-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:5px}
.mastery-option{display:flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--sub);font-size:12px;font-weight:700;cursor:pointer}
.mastery-option input{width:18px;height:18px;margin:0;flex-shrink:0}
.mastery-option.unsure input{accent-color:#A36918}.mastery-option.mastered input{accent-color:var(--green)}
.mastery-option.unsure.on{border-color:var(--amber-line);background:var(--amber-bg);color:#7A4B0F}
.mastery-option.mastered.on{border-color:#BCD9C6;background:var(--green-bg);color:var(--green)}
.mastery-option:focus-within{outline:3px solid rgba(49,93,155,.2);outline-offset:1px}
.practice-card{border:1px solid #C8D6EC;background:#F7FAFF;border-radius:18px;padding:17px;margin-top:8px}
.practice-scope-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.practice-scope-option{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;min-height:88px;padding:11px 8px;border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--sub);font-weight:700;line-height:1.35;text-align:center}
.practice-scope-option.on{border-color:var(--navy);background:var(--navy);color:#fff}
.practice-scope-option:focus-visible,.phrase-filter:focus-visible,.practice-start:focus-visible{outline:3px solid rgba(49,93,155,.25);outline-offset:2px}
.practice-scope-title{display:block;font-size:13px}.practice-scope-count{display:block;font-size:16px;margin-top:4px}
.practice-start{margin-top:11px;background:var(--stripe);color:#fff;min-height:54px;font-size:15px;border-radius:14px}
.phrase-filter-bar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.phrase-filter-bar::-webkit-scrollbar{display:none}
.phrase-filter{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;min-height:46px;padding:7px 3px;border:1px solid var(--line);border-radius:999px;background:var(--paper);color:var(--sub);font-size:11px;font-weight:700;white-space:nowrap}
.phrase-filter.on{border-color:var(--navy);background:var(--navy);color:#fff}
.phrase-filter-empty{padding:22px 16px;text-align:center;color:var(--sub);font-size:12px;line-height:1.7}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.safe-bottom{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
@media (max-width:420px){
  .phrase-row{flex-wrap:wrap}
  .phrase-actions{width:100%;justify-content:flex-end}
  .backup-actions{grid-template-columns:1fr}
}
@media (max-width:340px){
  .mastery-options{grid-template-columns:1fr}
  .phrase-filter-bar{display:flex;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .phrase-filter{flex:0 0 78px;font-size:11px}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
// ════════════════════════════════════════════════════════
// 研究英会話トレーナー (Gemini API版)
// APIキー: 同じフォルダの gemini_api_key.txt から自動読み込み
//   (file:// で開いた場合は自動読み込み不可 → ファイル選択 / 貼り付け)
// ════════════════════════════════════════════════════════

const DEFAULT_MODEL = "gemini-2.5-flash";

const SCENARIOS = [
  { id:"qa", label:"口頭発表 Q&A", en:"ORAL Q&A",
    desc:"発表直後の質疑応答。聴衆からの質問に英語で答える",
    partner:"Dr. Reyes", initial:"R",
    persona:"an audience member at an international conference, during the Q&A session right after the learner finished the oral presentation of this work. Open by briefly thanking them for the talk, then ask your first question." },
  { id:"poster", label:"ポスター発表", en:"POSTER SESSION",
    desc:"ポスターの前に来た研究者に説明し、議論する",
    partner:"Alex", initial:"A",
    persona:"a researcher who just walked up to the learner's poster at a poster session. Open casually, for example by asking them to walk you through the poster, then dig into details as the conversation flows." },
  { id:"coffee", label:"懇親会・雑談", en:"COFFEE BREAK",
    desc:"休憩時間のスモールトーク。雑談から研究の話へ",
    partner:"Maria", initial:"M",
    persona:"a friendly professor chatting with the learner during the conference coffee break. Start with light small talk (the conference, the venue, where they are from), then naturally ask what their research is about. Keep the register casual and warm." },
];

const DIFFS = [
  { id:"gentle", label:"やさしめ", style:"Ask supportive, fundamental questions in simple, clear English. Be warm and encouraging. Avoid aggressive or jargon-heavy questions." },
  { id:"normal", label:"標準", style:"Ask realistic academic questions like a genuinely curious fellow researcher, at a natural difficulty level." },
  { id:"tough", label:"鋭め", style:"Be a sharp but professional questioner: probe limitations, alternative explanations, validity, and novelty, and politely push back when answers are vague. Still one question at a time." },
];

const ANALYZE_MSGS = ["PDFを読み込んでいます…","研究内容を分析しています…","想定質問を考えています…"];

// ── state ──
const S = {
  stage:"loading",            // loading | key | upload | analyzing | setup | chat | summary | phrasebook
  apiKey:"", model:DEFAULT_MODEL,
  keyDraft:"", modelDraft:"", chatDraft:"",
  error:null, fileName:"", pdfB64:null, digest:null,
  scenario:"qa", difficulty:"normal", showDigest:false,
  persona:"", msgs:[], sending:false, chatError:null, pending:null,
  showFeedback:true, autoSpeak:false,
  hints:null, hintLoading:false, micNote:"",
  summary:null, summaryLoading:false, summaryError:false, summaryErrorMsg:"",
  savedPhrases:[], phraseReturnStage:"upload", phraseView:"list", phraseNotice:"",
  manualEnglishDraft:"", manualJapaneseDraft:"",
  reviewQueue:[], reviewIndex:0, reviewReveal:false, reviewRetried:{}, reviewAnsweredIds:new Set(), reviewMode:"active",
  practiceScope:"active", phraseListFilter:"all",
};
let recognition = null, listening = false, tickTimer = null, tick = 0;

const app = document.getElementById("app");
const $ = (id) => document.getElementById(id);
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function setStage(st){ S.stage = st; render(); }

// ── API key (端末内に保存) ──
const LS_KEY = "rtt_api_key", LS_MODEL = "rtt_model";
const LS_PHRASES = "rtt_saved_phrases_v1", LS_PHRASES_LEGACY = "rtt_saved_phrases";
const PHRASE_BACKUP_FORMAT = "eigakkaiwa.phrasebook.backup", PHRASE_BACKUP_VERSION = 2;
const PHRASE_BACKUP_MAX_BYTES = 20 * 1024 * 1024;
const PHRASE_BACKUP_MAX_ITEMS = 10000, PHRASE_BACKUP_MAX_TEXT = 4000;
const PHRASE_BACKUP_MAX_REVIEWS = 1000000;
let phraseBackupBusy = false, phraseBackupOperation = "";

function normalizePhraseText(value){
  let text = String(value == null ? "" : value).trim().replace(/\s+/g, " ");
  try{ text = text.normalize("NFKC"); }catch(e){}
  return text;
}

function phraseFingerprint(value){
  return normalizePhraseText(value)
    .toLowerCase().replace(/[\u2018\u2019]/g, "'").replace(/[\u201c\u201d]/g, '"')
    .replace(/[\s.!?。！？]+$/g, "");
}

function makePhraseId(){
  try{ if (crypto && crypto.randomUUID) return crypto.randomUUID(); }catch(e){}
  return "phrase_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 9);
}

function safeSavedDate(value, fallback){
  if (typeof value !== "string" || !value.trim()) return fallback;
  const ms = Date.parse(value);
  return Number.isFinite(ms) ? new Date(ms).toISOString() : fallback;
}

function safeReviewCount(value){
  const count = Number(value);
  return Number.isSafeInteger(count) && count >= 0
    ? Math.min(count, PHRASE_BACKUP_MAX_REVIEWS) : 0;
}

function safeMasteryStatus(value){
  return value === "unsure" || value === "mastered" || value === "unset" ? value : "unset";
}

function coerceSavedPhrase(raw, index){
  if (typeof raw === "string") raw = { english:raw };
  if (!raw || typeof raw !== "object") return null;
  const english = normalizePhraseText(raw.english || raw.en);
  if (!english) return null;
  const createdAt = safeSavedDate(raw.createdAt || raw.addedAt, new Date().toISOString());
  const reviewCount = safeReviewCount(raw.reviewCount);
  const rawId = normalizePhraseText(raw.id);
  const masteryStatus = safeMasteryStatus(raw.masteryStatus);
  const hasValidMastery = raw.masteryStatus === "unset" || raw.masteryStatus === "unsure" || raw.masteryStatus === "mastered";
  return {
    id:(rawId && rawId.length <= 200) ? rawId : ("legacy_" + index + "_" + phraseFingerprint(english).slice(0, 24)),
    english: english,
    japanese: normalizePhraseText(raw.japanese || raw.ja),
    createdAt: createdAt,
    sourceTitle: normalizePhraseText(raw.sourceTitle).slice(0, 800),
    scenario: normalizePhraseText(raw.scenario).slice(0, 80),
    reviewCount:reviewCount,
    correctCount:Math.min(reviewCount, safeReviewCount(raw.correctCount)),
    lastReviewedAt:safeSavedDate(raw.lastReviewedAt, null),
    masteryStatus:masteryStatus,
    masteryUpdatedAt:hasValidMastery ? safeSavedDate(raw.masteryUpdatedAt, null) : null,
  };
}

function writeSavedPhrases(items){
  try{
    localStorage.setItem(LS_PHRASES, JSON.stringify({ version:2, items:items }));
    S.savedPhrases = items;
    return true;
  }catch(e){
    S.phraseNotice = "この端末に保存できませんでした。ブラウザの保存設定をご確認ください。";
    return false;
  }
}

function loadSavedPhrases(){
  const previous = S.savedPhrases;
  let raw = null, migrated = false;
  try{
    raw = localStorage.getItem(LS_PHRASES);
    if (raw == null){ raw = localStorage.getItem(LS_PHRASES_LEGACY); migrated = raw != null; }
    if (raw == null){ S.savedPhrases = []; return true; }
    if (!raw) throw new Error("invalid_storage");
    const parsed = JSON.parse(raw);
    const source = Array.isArray(parsed) ? parsed : (parsed && Array.isArray(parsed.items) ? parsed.items : null);
    if (!source) throw new Error("invalid_storage");
    const seen = new Set(), ids = new Set();
    S.savedPhrases = source.map(coerceSavedPhrase).filter(p => {
      if (!p) return false;
      const key = phraseFingerprint(p.english);
      if (!key || seen.has(key)) return false;
      seen.add(key);
      if (ids.has(p.id)) p.id = makePhraseId();
      ids.add(p.id); return true;
    });
    const needsMigration = migrated || Array.isArray(parsed) || Number(parsed && parsed.version) < 2
      || source.some(item => !item || typeof item !== "object" || !("masteryStatus" in item));
    if (needsMigration) writeSavedPhrases(S.savedPhrases);
    return true;
  }catch(e){
    S.savedPhrases = previous;
    S.phraseNotice = "保存済みの表現を読み込めませんでした。";
    return false;
  }
}

function isPhraseSaved(english){
  const key = phraseFingerprint(english);
  return !!key && S.savedPhrases.some(p => phraseFingerprint(p.english) === key);
}

function phraseNeedsTranslation(phrase){
  const key = phraseFingerprint(phrase && phrase.english);
  const japanese = normalizePhraseText(phrase && phrase.japanese);
  if (!key || !japanese) return false;
  const found = S.savedPhrases.find(p => phraseFingerprint(p.english) === key);
  return !!found && !found.japanese;
}

function phraseNoticeIsError(){
  return /できません|入力してください|読み込めません|失敗|更新してください/.test(S.phraseNotice || "");
}

function savePhraseToBook(phrase, source){
  const english = normalizePhraseText(phrase && phrase.english);
  const japanese = normalizePhraseText(phrase && phrase.japanese);
  if (!english){ S.phraseNotice = "英語表現を入力してください。"; return "invalid"; }
  const key = phraseFingerprint(english);
  const found = S.savedPhrases.findIndex(p => phraseFingerprint(p.english) === key);
  if (found !== -1){
    if (!S.savedPhrases[found].japanese && japanese){
      const updated = S.savedPhrases.slice();
      updated[found] = Object.assign({}, updated[found], { japanese:japanese });
      if (!writeSavedPhrases(updated)) return "failed";
    }
    S.phraseNotice = "この表現は保存済みです。";
    return "exists";
  }
  source = source || {};
  const item = {
    id:makePhraseId(), english:english, japanese:japanese, createdAt:new Date().toISOString(),
    sourceTitle:normalizePhraseText(source.sourceTitle), scenario:normalizePhraseText(source.scenario),
    reviewCount:0, correctCount:0, lastReviewedAt:null,
    masteryStatus:"unset", masteryUpdatedAt:null,
  };
  if (!writeSavedPhrases([item].concat(S.savedPhrases))) return "failed";
  S.phraseNotice = "表現帳に保存しました。";
  return "added";
}

function saveSummaryPhrases(phrases){
  const source = { sourceTitle:S.digest && S.digest.title, scenario:S.scenario };
  const additions = [], updated = S.savedPhrases.slice();
  const byKey = new Map(), pendingKeys = new Set();
  updated.forEach((p, i) => { byKey.set(phraseFingerprint(p.english), i); });
  let translations = 0;
  (phrases || []).forEach(p => {
    const english = normalizePhraseText(p && p.english);
    const japanese = normalizePhraseText(p && p.japanese);
    const key = phraseFingerprint(english);
    if (!english || pendingKeys.has(key)) return;
    if (byKey.has(key)){
      const i = byKey.get(key);
      if (!updated[i].japanese && japanese){
        updated[i] = Object.assign({}, updated[i], { japanese:japanese }); translations += 1;
      }
      return;
    }
    pendingKeys.add(key);
    additions.push({
      id:makePhraseId(), english:english, japanese:japanese, createdAt:new Date().toISOString(),
      sourceTitle:normalizePhraseText(source.sourceTitle), scenario:normalizePhraseText(source.scenario),
      reviewCount:0, correctCount:0, lastReviewedAt:null,
      masteryStatus:"unset", masteryUpdatedAt:null,
    });
  });
  if (!additions.length && !translations){ S.phraseNotice = "すべて保存済みです。"; return 0; }
  if (!writeSavedPhrases(additions.concat(updated))) return 0;
  const parts = [];
  if (additions.length) parts.push(additions.length + "件を保存");
  if (translations) parts.push(translations + "件に日本語訳を追加");
  S.phraseNotice = parts.join("、") + "しました。";
  return additions.length + translations;
}

function removeSavedPhrase(id){
  const next = S.savedPhrases.filter(p => p.id !== id);
  if (next.length === S.savedPhrases.length) return false;
  if (!writeSavedPhrases(next)) return false;
  S.phraseNotice = "表現を削除しました。";
  return true;
}

function buildPhraseBackup(){
  return {
    format:PHRASE_BACKUP_FORMAT,
    schemaVersion:PHRASE_BACKUP_VERSION,
    exportedAt:new Date().toISOString(),
    itemCount:S.savedPhrases.length,
    items:S.savedPhrases.map(p => ({
      id:normalizePhraseText(p.id) || makePhraseId(),
      english:normalizePhraseText(p.english),
      japanese:normalizePhraseText(p.japanese),
      createdAt:safeSavedDate(p.createdAt, null),
      reviewCount:safeReviewCount(p.reviewCount),
      correctCount:Math.min(safeReviewCount(p.reviewCount), safeReviewCount(p.correctCount)),
      lastReviewedAt:safeSavedDate(p.lastReviewedAt, null),
      masteryStatus:safeMasteryStatus(p.masteryStatus),
      masteryUpdatedAt:safeSavedDate(p.masteryUpdatedAt, null),
    })),
  };
}

function phraseBackupFileName(){
  const now = new Date(), pad = value => String(value).padStart(2, "0");
  const stamp = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate())
    + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
  return "eigakkaiwa-phrases-" + stamp + ".json";
}

function readBackupFileText(file){
  if (file && typeof file.text === "function") return file.text();
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result || ""));
    reader.onerror = () => reject(new Error("read_failed"));
    reader.readAsText(file);
  });
}

function parsePhraseBackup(text){
  if (typeof text !== "string" || text.length > PHRASE_BACKUP_MAX_BYTES) throw new Error("too_large");
  let parsed;
  try{ parsed = JSON.parse(text); }catch(e){ throw new Error("invalid_backup"); }
  let source = null, sourceVersion = 0;
  if (Array.isArray(parsed)) source = parsed;
  else if (parsed && parsed.format === PHRASE_BACKUP_FORMAT){
    sourceVersion = Number(parsed.schemaVersion);
    if (sourceVersion > PHRASE_BACKUP_VERSION) throw new Error("future_backup");
    if ((sourceVersion !== 1 && sourceVersion !== 2) || !Array.isArray(parsed.items)) throw new Error("invalid_backup");
    source = parsed.items;
  } else if (parsed && (Number(parsed.version) === 1 || Number(parsed.version) === 2) && Array.isArray(parsed.items)){
    sourceVersion = Number(parsed.version);
    source = parsed.items;
  }
  if (!source || source.length > PHRASE_BACKUP_MAX_ITEMS) throw new Error("invalid_backup");

  const items = [], seen = new Set(), ids = new Set();
  source.forEach((raw, index) => {
    if (typeof raw !== "string"){
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) throw new Error("invalid_backup");
      const rawEnglish = raw.english != null ? raw.english : raw.en;
      const rawJapanese = raw.japanese != null ? raw.japanese : raw.ja;
      if (typeof rawEnglish !== "string" || (rawJapanese != null && typeof rawJapanese !== "string")) throw new Error("invalid_backup");
      if (sourceVersion >= 2){
        if (raw.masteryStatus != null && safeMasteryStatus(raw.masteryStatus) !== raw.masteryStatus) throw new Error("invalid_backup");
        if (raw.masteryUpdatedAt != null && safeSavedDate(raw.masteryUpdatedAt, null) == null) throw new Error("invalid_backup");
      }
    }
    const normalizedRaw = sourceVersion >= 2 || typeof raw === "string"
      ? raw : Object.assign({}, raw, { masteryStatus:"unset", masteryUpdatedAt:null });
    const item = coerceSavedPhrase(normalizedRaw, index);
    if (!item || item.english.length > PHRASE_BACKUP_MAX_TEXT || item.japanese.length > PHRASE_BACKUP_MAX_TEXT) throw new Error("invalid_backup");
    if (sourceVersion < 2){ item.masteryStatus = "unset"; item.masteryUpdatedAt = null; }
    item.sourceTitle = ""; item.scenario = "";
    const key = phraseFingerprint(item.english);
    if (seen.has(key)) return;
    seen.add(key);
    if (ids.has(item.id)) item.id = makePhraseId();
    ids.add(item.id); items.push(item);
  });
  return items;
}

function earlierSavedDate(a, b){
  const am = new Date(a || 0).getTime(), bm = new Date(b || 0).getTime();
  if (!isNaN(am) && !isNaN(bm)) return am <= bm ? a : b;
  return a || b || new Date().toISOString();
}

function laterSavedDate(a, b){
  const am = new Date(a || 0).getTime(), bm = new Date(b || 0).getTime();
  if (!isNaN(am) && !isNaN(bm)) return am >= bm ? a : b;
  return a || b || null;
}

function mergeMasteryState(current, imported){
  const currentStatus = safeMasteryStatus(current && current.masteryStatus);
  const importedStatus = safeMasteryStatus(imported && imported.masteryStatus);
  const currentAt = safeSavedDate(current && current.masteryUpdatedAt, null);
  const importedAt = safeSavedDate(imported && imported.masteryUpdatedAt, null);
  const currentMs = currentAt ? Date.parse(currentAt) : NaN;
  const importedMs = importedAt ? Date.parse(importedAt) : NaN;
  if (Number.isFinite(importedMs) && (!Number.isFinite(currentMs) || importedMs > currentMs)){
    return { masteryStatus:importedStatus, masteryUpdatedAt:importedAt };
  }
  if (Number.isFinite(currentMs)) return { masteryStatus:currentStatus, masteryUpdatedAt:currentAt };
  if (currentStatus === "unset" && importedStatus !== "unset"){
    return { masteryStatus:importedStatus, masteryUpdatedAt:importedAt };
  }
  return { masteryStatus:currentStatus, masteryUpdatedAt:currentAt };
}

function mergePhraseBackupItems(imported){
  const next = S.savedPhrases.slice(), byKey = new Map(), usedIds = new Set();
  next.forEach((p, index) => { byKey.set(phraseFingerprint(p.english), index); usedIds.add(p.id); });
  const additions = [];
  let updated = 0, unchanged = 0;
  imported.forEach(item => {
    const key = phraseFingerprint(item.english);
    if (!byKey.has(key)){
      const copy = Object.assign({}, item);
      if (!copy.id || usedIds.has(copy.id)) copy.id = makePhraseId();
      usedIds.add(copy.id); additions.push(copy); return;
    }
    const index = byKey.get(key), current = next[index];
    const reviewCount = Math.max(Number(current.reviewCount) || 0, Number(item.reviewCount) || 0);
    const correctCount = Math.min(reviewCount, Math.max(Number(current.correctCount) || 0, Number(item.correctCount) || 0));
    const mastery = mergeMasteryState(current, item);
    const merged = Object.assign({}, current, {
      japanese:current.japanese || item.japanese,
      createdAt:earlierSavedDate(current.createdAt, item.createdAt),
      sourceTitle:current.sourceTitle || item.sourceTitle,
      scenario:current.scenario || item.scenario,
      reviewCount:reviewCount,
      correctCount:correctCount,
      lastReviewedAt:laterSavedDate(current.lastReviewedAt, item.lastReviewedAt),
      masteryStatus:mastery.masteryStatus,
      masteryUpdatedAt:mastery.masteryUpdatedAt,
    });
    const changed = merged.japanese !== current.japanese || merged.createdAt !== current.createdAt
      || merged.sourceTitle !== current.sourceTitle || merged.scenario !== current.scenario
      || merged.reviewCount !== current.reviewCount || merged.correctCount !== current.correctCount
      || merged.lastReviewedAt !== current.lastReviewedAt || merged.masteryStatus !== current.masteryStatus
      || merged.masteryUpdatedAt !== current.masteryUpdatedAt;
    if (changed){ next[index] = merged; updated += 1; } else unchanged += 1;
  });
  return { items:additions.concat(next), added:additions.length, updated:updated, unchanged:unchanged };
}

async function importPhraseBackupFile(file){
  if (phraseBackupBusy) return;
  phraseBackupBusy = true; phraseBackupOperation = "import"; refreshPhraseBookBadges();
  try{
    if (!file || Number(file.size || 0) > PHRASE_BACKUP_MAX_BYTES) throw new Error("too_large");
    const imported = parsePhraseBackup(await readBackupFileText(file));
    if (!loadSavedPhrases()) throw new Error("storage_read_failed");
    const merged = mergePhraseBackupItems(imported);
    if (!writeSavedPhrases(merged.items)){ refreshPhraseBookBadges(); return; }
    if (!imported.length) S.phraseNotice = "バックアップに保存された表現はありませんでした。";
    else if (!merged.added && !merged.updated) S.phraseNotice = "すべて読み込み済みです（" + merged.unchanged + "件）。";
    else {
      const parts = [];
      if (merged.added) parts.push(merged.added + "件を追加");
      if (merged.updated) parts.push(merged.updated + "件の学習状態・復習履歴を更新");
      S.phraseNotice = "バックアップから" + parts.join("、") + "しました。";
    }
    if (S.stage === "phrasebook") renderPhraseBook(); else refreshPhraseBookBadges();
  }catch(e){
    S.phraseNotice = e && e.message === "too_large"
      ? "バックアップが大きすぎるため読み込めませんでした。"
      : (e && e.message === "future_backup"
        ? "新しい形式のバックアップです。アプリを更新してください。"
        : (e && e.message === "storage_read_failed"
          ? "現在の表現帳を確認できなかったため、読み込みを中止しました。"
          : "表現帳のバックアップとして読み込めませんでした。"));
  }finally{
    phraseBackupBusy = false; phraseBackupOperation = "";
    refreshPhraseBookBadges();
  }
}

// ── Gemini API ──
async function callGemini(contents, opts){
  opts = opts || {};
  const url = "https://generativelanguage.googleapis.com/v1beta/models/"
    + encodeURIComponent(S.model) + ":generateContent?key=" + encodeURIComponent(S.apiKey);
  const body = {
    contents: contents,
    generationConfig: {
      maxOutputTokens: 8192,
      temperature: opts.temperature == null ? 0.8 : opts.temperature,
      responseMimeType: "application/json",
    },
  };
  if (opts.schema) body.generationConfig.responseSchema = opts.schema;
  // gemini-2.5-flash系は内部思考トークンが出力上限を食い潰し空応答になることがあるため無効化
  if (String(S.model).indexOf("2.5-flash") !== -1) body.generationConfig.thinkingConfig = { thinkingBudget: 0 };
  const res = await fetch(url, {
    method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify(body),
  });
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if (!res.ok || (data && data.error)){
    const msg = (data && data.error && data.error.message) || ("HTTP " + res.status);
    if (/api key/i.test(msg)) throw new Error("APIキーが無効です。gemini_api_key.txt の内容を確認してください。");
    if (/not found|is not supported/i.test(msg)) throw new Error("モデル「" + S.model + "」が見つかりません。txtファイルの model= 行を確認してください。");
    if (/quota|rate/i.test(msg)) throw new Error("APIの利用上限に達しました。しばらく待ってからお試しください。");
    throw new Error(msg);
  }
  const cand = data && data.candidates && data.candidates[0];
  if (!cand || !cand.content || !cand.content.parts){
    throw new Error("応答を取得できませんでした（finishReason: " + ((cand && cand.finishReason) || "不明") + "）。");
  }
  return cand.content.parts.map(p => p.text || "").join("");
}

function extractBalancedJSON(text){
  const start = text.indexOf("{");
  if (start === -1) return null;
  let depth = 0, inStr = false, escaped = false;
  for (let i = start; i < text.length; i++){
    const ch = text[i];
    if (inStr){
      if (escaped) escaped = false;
      else if (ch === "\\") escaped = true;
      else if (ch === '"') inStr = false;
    } else {
      if (ch === '"') inStr = true;
      else if (ch === "{") depth++;
      else if (ch === "}"){ depth--; if (depth === 0) return text.slice(start, i + 1); }
    }
  }
  return null;
}

function parseModelJSON(text){
  const cleaned = String(text).replace(/```(?:json)?/gi, "").trim();
  const candidates = [];
  const bal = extractBalancedJSON(cleaned);
  if (bal) candidates.push(bal);
  const s = cleaned.indexOf("{"), e = cleaned.lastIndexOf("}");
  if (s !== -1 && e > s && cleaned.slice(s, e + 1) !== bal) candidates.push(cleaned.slice(s, e + 1));
  for (const c of candidates){
    try{ return JSON.parse(c); }catch(err){}
    try{ return JSON.parse(c.replace(/[\r\n\t]+/g, " ")); }catch(err){}
  }
  throw new Error("no json");
}

// 解析が完全に失敗しても、返答と添削をフィールド単位で救出する（生JSONは表示しない）
function looseChatParse(text){
  const t = String(text);
  const grab = (key) => {
    const m = t.match(new RegExp('"' + key + '"\\s*:\\s*"((?:[^"\\\\]|\\\\.)*)"'));
    if (!m) return "";
    try{ return JSON.parse('"' + m[1] + '"'); }catch(e){ return m[1]; }
  };
  const reply = grab("reply");
  if (reply){
    return { reply: reply, feedback: {
      hasIssues: /"hasIssues"\s*:\s*true/.test(t),
      corrected: grab("corrected"),
      explanation: grab("explanation"),
    }};
  }
  return { reply: t.replace(/```(?:json)?/gi, "").replace(/[{}"]/g, " ").replace(/\s+/g, " ").trim(),
           feedback: { hasIssues:false, corrected:"", explanation:"" } };
}

function toggleListening(){
  if (listening){
    try{ if (recognition) recognition.stop(); }catch(e){}
    setListeningUI(false); return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){ showMicNote("このブラウザでは音声入力が使えません。テキスト入力をご利用ください。"); return; }
  if (location.protocol === "file:"){
    showMicNote("file:// で開いている場合、音声入力は使えません（ローカルサーバー経由なら利用可）。テキスト入力をご利用ください。");
    return;
  }
  try{
    const rec = new SR();
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false;
    rec.onresult = (e) => {
      const t = Array.from(e.results).map(r => r[0].transcript).join("");
      S.chatDraft = t;
      const ta = $("chatInput"); if (ta) ta.value = S.chatDraft;

    rec.onend = () => setListeningUI(false);
    recognition = rec; rec.start();

  }catch(e){

}

// ── 録音→Gemini文字起こし方式の音声入力 ──
let mediaRec = null, mediaStream = null, recChunks = [];
let recTimer = null, recStart = 0, recording = false, transcribing = false, discardRec = false;

function updateRecUI(){
  const mic = $("micBtn"), st = $("micStatus");
  if (!mic) return;
  if (recording){
    const sec = Math.floor((Date.now() - recStart) / 1000);
    mic.classList.add("listening");
    mic.style.background = "var(--stripe)"; mic.style.color = "#fff"; mic.textContent = "■";
    if (st){ st.style.display = "inline"; st.textContent = "● 録音中 " + Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0") + " ─ タップで停止"; }
  } else if (transcribing){
    mic.classList.remove("listening");
    mic.style.background = "#E7EAF0"; mic.style.color = "var(--navy)"; mic.textContent = "…";
    if (st){ st.style.display = "inline"; st.textContent = "文字起こし中…"; }
  } else {
    mic.classList.remove("listening");
    mic.style.background = "#E7EAF0"; mic.style.color = "var(--navy)"; mic.textContent = "🎙";
    if (st) st.style.display = "none";
  }
}

async function toggleRecording(){
  if (transcribing) return;
  if (recording){ stopRecording(); return; }
  if (!(navigator.mediaDevices && window.MediaRecorder)){ toggleListening(); return; } // 旧方式にフォールバック
  try{
    mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  }catch(e){
    showMicNote("マイクを使用できませんでした。ブラウザのマイク許可設定を確認してください。");
    return;
  }
  recChunks = []; discardRec = false;
  let mime = "";
  for (const c of ["audio/webm;codecs=opus", "audio/webm", "audio/ogg;codecs=opus", "audio/mp4"]){
    if (MediaRecorder.isTypeSupported(c)){ mime = c; break; }
  }
  try{
    mediaRec = mime ? new MediaRecorder(mediaStream, { mimeType: mime }) : new MediaRecorder(mediaStream);
  }catch(e){
    mediaRec = new MediaRecorder(mediaStream);
  }
  mediaRec.ondataavailable = (e) => { if (e.data && e.data.size) recChunks.push(e.data); };
  mediaRec.onstop = onRecStopped;
  mediaRec.start();
  recording = true; recStart = Date.now();
  showMicNote("");
  updateRecUI();
  recTimer = setInterval(() => {
    updateRecUI();
    if (Date.now() - recStart > 120000) stopRecording(); // 2分で自動停止
  }, 500);
}

function stopRecording(){
  if (recTimer){ clearInterval(recTimer); recTimer = null; }
  recording = false;
  try{ if (mediaRec && mediaRec.state !== "inactive") mediaRec.stop(); }catch(e){}
  updateRecUI();
}

async function onRecStopped(){
  try{ if (mediaStream) mediaStream.getTracks().forEach(t => t.stop()); }catch(e){}
  if (discardRec || S.stage !== "chat"){ discardRec = false; return; }
  const blob = new Blob(recChunks, { type: (mediaRec && mediaRec.mimeType) || "audio/webm" });
  if (blob.size < 1500){
    updateRecUI();
    showMicNote("録音が短すぎました。もう一度お試しください。");
    return;
  }
  transcribing = true; updateRecUI();
  try{
    const b64 = await readFileB64(blob);
    const prompt = "This audio is a Japanese researcher practicing spoken English. A Japanese accent, a slow pace, long pauses, and fillers are all expected and normal.\n"
      + "Transcribe their English speech faithfully. Remove filler sounds (um, ah, e-to) but do NOT correct grammar mistakes - keep exactly what they said. If a word is unclear, write your best guess from the context of someone describing academic research.\n"
      + 'Respond ONLY with valid JSON: {"transcript":"what they said in English"}';
    const out = await callGemini([
      { role:"user", parts:[
        { inline_data:{ mime_type: blob.type.split(";")[0] || "audio/webm", data: b64 } },
        { text: prompt },
      ]},
    ], { temperature: 0.2, schema: SCHEMA_TRANSCRIPT });
    const parsed = parseModelJSON(out);
    const t = String(parsed.transcript || "").trim();
    const ta = $("chatInput");
    if (t){
      S.chatDraft = (S.chatDraft.trim() ? S.chatDraft.trim() + " " : "") + t;
      if (ta){ ta.value = S.chatDraft; ta.focus(); }
    } else if (!t){
      showMicNote("音声を聞き取れませんでした。マイクに近づいて、もう一度お試しください。");
    }
  }catch(e){
    showMicNote("文字起こしに失敗しました" + (e && e.message ? "（" + e.message + "）" : "") + "。もう一度お試しください。");
  }finally{
    transcribing = false; updateRecUI();
  }
}

async function openPdfPicker(fallbackInput){
  if (usePdfInputFallback || typeof window.showOpenFilePicker !== "function"){

  }
  try{

        description:"PDFファイル",

async function handleFile(file){
  if (!file) return;
  const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
  if (!isPdf){ S.error = "PDFファイルをアップロードしてください。"; render(); return; }
  if (file.size > 15 * 1024 * 1024){ S.error = "ファイルが大きすぎます。15MB以下のPDFをご利用ください。"; render(); return; }
  S.error = null; S.fileName = file.name;
  setStage("analyzing");
  try{
    S.pdfB64 = await readFileB64(file);
    await analyzePdf();
  }catch(e){
    S.error = "PDFの読み込みに失敗しました。もう一度お試しください。"; render();
  }
}

async function analyzePdf(){
  S.error = null; render();
  try{
    const prompt = 'The attached PDF is an academic paper or a conference poster. Analyze it carefully.\n'
      + 'Respond ONLY with valid JSON in this exact shape:\n'
      + '{"title":"the title as written in the document","field":"研究分野（日本語で簡潔に）","docType":"paper or poster","summary":"A thorough digest in English, 250-330 words, covering: research question and motivation, methodology, key findings with specific numbers or results where available, main contributions, and limitations. Write it so a conversation partner could ask informed, specific questions about this work.","keyTerms":["6-10 key technical terms from the document"],"sampleQuestions":["3 short questions in English that an audience member might realistically ask"]}';
    const out = await callGemini([
      { role:"user", parts:[
        { inline_data:{ mime_type:"application/pdf", data:S.pdfB64 } },
        { text: prompt },
      ]},
    ], { temperature:0.3, schema: SCHEMA_DIGEST });
    const parsed = parseModelJSON(out);
    if (!parsed.summary || !parsed.title) throw new Error("bad digest");
    S.digest = parsed;
    setStage("setup");
  }catch(e){
    S.error = "PDFの分析に失敗しました。" + (e && e.message ? "（" + e.message + "）" : "");
    render();
  }
}

// ── chat ──
function historyToContents(history){
  const contents = [
    { role:"user", parts:[{ text: S.persona + "\n\nBegin the conversation now with your opening line." }] },
  ];
  for (const m of history){
    if (m.role === "ai"){
      contents.push({ role:"model", parts:[{ text: JSON.stringify({
        reply: m.text,
        feedback: m.feedback || { hasIssues:false, corrected:"", explanation:"" },
      })}]});
    } else {
      contents.push({ role:"user", parts:[{ text: m.text }] });
    }
  }
  return contents;
}

async function runTurn(history){
  S.sending = true; S.chatError = null;
  renderMsgs();
  try{
    const out = await callGemini(historyToContents(history), { temperature:0.9, schema: SCHEMA_CHAT });
    let parsed;
    try{ parsed = parseModelJSON(out); }
    catch(e){ parsed = looseChatParse(out); }
    S.msgs = history.concat([{ role:"ai", text: parsed.reply || "…", feedback: parsed.feedback || null }]);
    if (S.autoSpeak) speak(parsed.reply || "");
  }catch(e){
    S.pending = history; S.msgs = history;
    S.chatError = "エラー: " + (e && e.message ? e.message : "通信に失敗しました。");
  }finally{
    S.sending = false; renderMsgs();
  }
}

// ── summary ──
// モデルが3区分を1つの配列に平坦化して返す異常パターンを検出し、正しい構造に復元する
function sanitizeSummary(sm){
  sm = sm || {};
  const norm = (x) => String(x == null ? "" : x).trim();
  const isLabel = (x, name) => norm(x).toLowerCase().replace(/^[・\-\*\s"':：]+|["'\s:：]+$/g, "") === name;
  const PLACEHOLDERS = ["具体的な改善ポイント", "良かった点", "この場面で使える便利な英語表現", "日本語訳", "..."];
  const LABELS = ["improvements", "phrases", "strengths", "english", "japanese", "overall"];
  const isJunk = (x) => {
    const t = norm(x);
    return !t || PLACEHOLDERS.indexOf(t) !== -1 || LABELS.some(n => isLabel(t, n));
  };

  let strengths = Array.isArray(sm.strengths) ? sm.strengths.map(norm) : [];
  let improvements = Array.isArray(sm.improvements) ? sm.improvements.map(norm) : [];
  let phrases = Array.isArray(sm.phrases) ? sm.phrases : [];

  // 平坦化検出: strengths内に "improvements" / "phrases" のラベルが混入しているケース
  const idxImp = strengths.findIndex(x => isLabel(x, "improvements"));
  const idxPhr = strengths.findIndex(x => isLabel(x, "phrases"));
  if (idxImp !== -1 || idxPhr !== -1){
    const flat = strengths;
    const cut1 = idxImp !== -1 ? idxImp : (idxPhr !== -1 ? idxPhr : flat.length);
    const cut2 = idxPhr !== -1 ? idxPhr : flat.length;
    strengths = flat.slice(0, cut1);
    if (!improvements.length && idxImp !== -1) improvements = flat.slice(idxImp + 1, cut2);
    if ((!phrases || !phrases.length) && idxPhr !== -1){
      const tail = flat.slice(idxPhr + 1);
      const ps = [];
      let cur = null, mode = "";
      for (const item of tail){
        if (isLabel(item, "english")){ mode = "e"; continue; }
        if (isLabel(item, "japanese")){ mode = "j"; continue; }
        if (isJunk(item)) continue;
        if (mode === "e"){ cur = { english: norm(item), japanese: "" }; ps.push(cur); mode = ""; }
        else if (mode === "j"){ if (cur) cur.japanese = norm(item); mode = ""; cur = null; }
        else if (cur && !cur.japanese){ cur.japanese = norm(item); cur = null; }
        else { cur = { english: norm(item), japanese: "" }; ps.push(cur); }
      }
      phrases = ps;
    }
  }

  strengths = strengths.filter(x => !isJunk(x));
  improvements = improvements.filter(x => !isJunk(x));

  // phrasesが文字列配列で返ってきた場合は english/japanese のペアに変換
  if (phrases.length && typeof phrases[0] === "string"){
    const ps = [];
    const items = phrases.map(norm).filter(x => !isJunk(x));
    for (let i = 0; i < items.length; i += 2){
      ps.push({ english: items[i], japanese: items[i + 1] || "" });
    }
    phrases = ps;
  }
  phrases = (phrases || []).filter(p => p && norm(p.english) && !isJunk(p.english));

  return { overall: norm(sm.overall), strengths: strengths, improvements: improvements, phrases: phrases };
}

async function genSummary(){
  S.summary = null; S.summaryError = false; S.summaryErrorMsg = ""; S.summaryLoading = true; S.phraseNotice = ""; render();
  let bestSummary = null;
  try{
    const transcript = S.msgs.map(m => (m.role === "ai" ? "Partner: " : "Learner: ") + m.text).join("\n");
    const prompt = "以下は日本人研究者の英会話練習の記録です（Partner=会話相手、Learner=練習者）。Learnerの英語を分析し、日本語でフィードバックしてください。\n---\n"
      + transcript + "\n---\n"
      + 'Respond ONLY with valid JSON with these fields: overall（総評、日本語2〜3文、励ましを含む）, strengths（良かった点の配列、日本語で2〜3個）, improvements（具体的な改善ポイントの配列、日本語で2〜3個）, phrases（この場面で使える英語表現の配列、各要素は english と japanese を持つオブジェクト、3〜4個）.\n'
      + '重要: strengths・improvements・phrases は必ず別々の配列に分けること。キー名（improvements, phrases, english, japanese 等）やテンプレート文を配列の要素として出力しないこと。';
    for (let attempt = 0; attempt < 2; attempt++){
      const retryNote = attempt
        ? "\n前回は一部の配列が欠けていました。4つの必須フィールドをすべて埋め、improvementsを2〜3個、phrasesを3〜4個必ず返してください。"
        : "";
      const out = await callGemini([{ role:"user", parts:[{ text: prompt + retryNote }] }], { temperature:0.5, schema: SCHEMA_SUMMARY });
      let candidate = null;
      try{ candidate = sanitizeSummary(parseModelJSON(out)); }catch(e){ if (attempt === 1) throw e; }
      if (!candidate) continue;
      if (bestSummary){
        candidate = {
          overall:candidate.overall || bestSummary.overall,
          strengths:candidate.strengths.length ? candidate.strengths : bestSummary.strengths,
          improvements:candidate.improvements.length ? candidate.improvements : bestSummary.improvements,
          phrases:candidate.phrases.length ? candidate.phrases : bestSummary.phrases,
        };
      }
      bestSummary = candidate;
      const complete = !!candidate.overall && candidate.strengths.length >= 2
        && candidate.improvements.length >= 2 && candidate.phrases.length >= 3;
      if (complete){ S.summary = candidate; return; }
    }
    S.summary = bestSummary;
    throw new Error("改善ポイントまたは使える表現を取得できませんでした");
  }catch(e){
    if (!S.summary && bestSummary) S.summary = bestSummary;
    S.summaryError = true; S.summaryErrorMsg = (e && e.message) ? e.message : "";
  }
  finally{ S.summaryLoading = false; render(); }
}

function endSession(){
  try{ if (window.speechSynthesis) window.speechSynthesis.cancel(); }catch(e){}
  if (recording){ discardRec = true; stopRecording(); }
  const userTurns = S.msgs.filter(m => m.role === "user").length;
  if (userTurns === 0){ S.msgs = []; setStage("setup"); return; }
  setStage("summary");
  genSummary();
}

// ── saved phrases / review ──
function formatSavedDate(value){
  const d = new Date(value);
  if (!value || isNaN(d.getTime())) return "";
  try{ return d.toLocaleDateString("ja-JP", { year:"numeric", month:"short", day:"numeric" }); }
  catch(e){ return d.toISOString().slice(0, 10); }
}

function phraseMasteryCounts(){
  const counts = { unset:0, unsure:0, mastered:0 };
  S.savedPhrases.forEach(p => { counts[safeMasteryStatus(p.masteryStatus)] += 1; });
  return counts;
}

function phraseMatchesListFilter(phrase, filter){
  filter = filter === "unset" || filter === "unsure" || filter === "mastered" ? filter : "all";
  return filter === "all" || safeMasteryStatus(phrase && phrase.masteryStatus) === filter;
}

function practiceScopeCount(counts, scope){
  return scope === "unsure" ? counts.unsure : counts.unset + counts.unsure;
}

function setPhraseMasteryStatus(id, status){
  if (status !== "unset" && status !== "unsure" && status !== "mastered") return false;
  const index = S.savedPhrases.findIndex(p => p.id === id);
  if (index === -1) return false;
  const next = S.savedPhrases.slice();
  next[index] = Object.assign({}, next[index], {
    masteryStatus:status,
    masteryUpdatedAt:new Date().toISOString(),
  });
  if (!writeSavedPhrases(next)) return false;
  S.phraseNotice = status === "mastered" ? "「覚えた」に設定しました。通常の練習から外れます。"
    : (status === "unsure" ? "「まだ不安」に設定しました。" : "学習状態を未設定に戻しました。");
  return true;
}

function startPhraseReview(mode){
  mode = mode === "unsure" ? "unsure" : "active";
  const candidates = S.savedPhrases.filter(p => mode === "unsure"
    ? safeMasteryStatus(p.masteryStatus) === "unsure"
    : safeMasteryStatus(p.masteryStatus) !== "mastered");
  if (!candidates.length){
    S.phraseNotice = mode === "unsure"
      ? "「まだ不安」にチェックした表現がありません。"
      : "練習対象がありません。「覚えた」のチェックを外すと練習できます。";
    refreshPhraseBookBadges(); return;
  }
  S.reviewQueue = candidates.slice().sort((a, b) => {
    if (mode === "active"){
      const aUnsure = safeMasteryStatus(a.masteryStatus) === "unsure" ? 0 : 1;
      const bUnsure = safeMasteryStatus(b.masteryStatus) === "unsure" ? 0 : 1;
      if (aUnsure !== bUnsure) return aUnsure - bUnsure;
    }
    if (!a.lastReviewedAt && b.lastReviewedAt) return -1;
    if (a.lastReviewedAt && !b.lastReviewedAt) return 1;
    const aRate = a.reviewCount ? a.correctCount / a.reviewCount : 0;
    const bRate = b.reviewCount ? b.correctCount / b.reviewCount : 0;
    if (aRate !== bRate) return aRate - bRate;
    return String(a.lastReviewedAt || a.createdAt).localeCompare(String(b.lastReviewedAt || b.createdAt));
  }).map(p => p.id);
  S.reviewIndex = 0; S.reviewReveal = false; S.reviewRetried = {}; S.reviewAnsweredIds = new Set(); S.reviewMode = mode;
  S.phraseView = "review"; S.phraseNotice = "";
  renderPhraseBook();
}

function currentReviewPhrase(){
  const id = S.reviewQueue[S.reviewIndex];
  return S.savedPhrases.find(p => p.id === id) || null;
}

function recordPhraseReview(remembered){
  const current = currentReviewPhrase();
  if (!current) return;
  const now = new Date().toISOString();
  const next = S.savedPhrases.map(p => p.id === current.id ? Object.assign({}, p, {
    reviewCount:(Number(p.reviewCount) || 0) + 1,
    correctCount:(Number(p.correctCount) || 0) + (remembered ? 1 : 0),
    lastReviewedAt:now,
    masteryStatus:remembered ? "mastered" : "unsure",
    masteryUpdatedAt:now,
  }) : p);
  if (!writeSavedPhrases(next)){ refreshPhraseBookBadges(); return; }
  S.phraseNotice = "";
  S.reviewAnsweredIds.add(current.id);
  if (!remembered && !S.reviewRetried[current.id]){
    S.reviewRetried[current.id] = true;
    S.reviewQueue.push(current.id);
  }
  S.reviewIndex += 1; S.reviewReveal = false;
  if (S.reviewIndex >= S.reviewQueue.length) S.phraseView = "done";
  renderPhraseBook();
}

function preparePhraseReviewExit(){
  const answered = S.reviewAnsweredIds instanceof Set ? S.reviewAnsweredIds.size : 0;
  S.reviewReveal = false; S.phraseView = "list";
  if (!phraseNoticeIsError()){
    S.phraseNotice = answered
      ? "回答済みの" + answered + "件を保存しました。未回答の表現は変更していません。"
      : "練習を終了しました。未回答の表現は変更していません。";
  }
}

function finishPhraseReviewEarly(){
  preparePhraseReviewExit(); renderPhraseBook();
}

function syncPhraseMasteryControls(){
  const counts = phraseMasteryCounts();
  const phrasesById = new Map(S.savedPhrases.map(p => [p.id, p]));
  if (S.practiceScope !== "unsure") S.practiceScope = "active";
  if (["all","unset","unsure","mastered"].indexOf(S.phraseListFilter) === -1) S.phraseListFilter = "all";
  const activeCount = counts.unset + counts.unsure;
  const unsetCount = $("masteryUnsetCount"), unsureCount = $("masteryUnsureCount"), masteredCount = $("masteryMasteredCount");
  if (unsetCount) unsetCount.textContent = counts.unset;
  if (unsureCount) unsureCount.textContent = counts.unsure;
  if (masteredCount) masteredCount.textContent = counts.mastered;
  document.querySelectorAll(".phraseMastery").forEach(input => {
    const phrase = phrasesById.get(input.getAttribute("data-id"));
    const checked = !!phrase && safeMasteryStatus(phrase.masteryStatus) === input.getAttribute("data-status");
    input.checked = checked;
    const label = input.closest && input.closest(".mastery-option");
    if (label) label.classList.toggle("on", checked);
  });
  const activeScope = $("practiceActiveBtn"), unsureScope = $("practiceUnsureBtn");
  [[activeScope, "active"], [unsureScope, "unsure"]].forEach(pair => {
    if (!pair[0]) return;
    const selected = S.practiceScope === pair[1];
    pair[0].classList.toggle("on", selected); pair[0].setAttribute("aria-pressed", selected ? "true" : "false");
  });
  const activeScopeCount = $("practiceActiveCount"), unsureScopeCount = $("practiceUnsureCount");
  if (activeScopeCount) activeScopeCount.textContent = activeCount + "件";
  if (unsureScopeCount) unsureScopeCount.textContent = counts.unsure + "件";
  const selectedCount = practiceScopeCount(counts, S.practiceScope);
  const start = $("startReviewBtn");
  if (start){
    start.disabled = selectedCount === 0;
    start.textContent = selectedCount
      ? "選んだ表現を練習する（" + selectedCount + "件）" : "練習対象の表現はありません";
  }
  const filterCounts = { all:S.savedPhrases.length, unset:counts.unset, unsure:counts.unsure, mastered:counts.mastered };
  document.querySelectorAll(".phrase-filter").forEach(button => {
    const filter = button.getAttribute("data-filter");
    const selected = filter === S.phraseListFilter;
    button.classList.toggle("on", selected); button.setAttribute("aria-pressed", selected ? "true" : "false");
    const count = button.querySelector && button.querySelector(".phrase-filter-count");
    if (count) count.textContent = filterCounts[filter] == null ? 0 : filterCounts[filter];
  });
  let visible = 0;
  document.querySelectorAll(".savedPhraseCard").forEach(card => {
    const phrase = phrasesById.get(card.getAttribute("data-id"));
    const show = !!phrase && phraseMatchesListFilter(phrase, S.phraseListFilter);
    card.hidden = !show; if (show) visible += 1;
  });
  const empty = $("phraseFilterEmpty");
  if (empty) empty.hidden = visible !== 0;
  const filterStatus = $("phraseFilterStatus");
  if (filterStatus) filterStatus.textContent = visible + "件の表現を表示しています。";
}

// ── summary ──
function syncSummaryPhraseControls(){
  const phrases = (S.summary && S.summary.phrases) || [];
  document.querySelectorAll(".phraseSave").forEach(b => {
    const p = phrases[Number(b.getAttribute("data-p"))];
    const saved = p && isPhraseSaved(p.english);
    const enrich = p && phraseNeedsTranslation(p);
    const complete = saved && !enrich;
    b.textContent = complete ? "✓ 保存済み" : (enrich ? "＋ 訳を追加" : "＋ 保存");
    b.classList.toggle("saved", !!complete); b.disabled = !!complete;
  });
  const all = $("saveAllPhrases");
  if (all){
    const done = phrases.length > 0 && phrases.every(p => isPhraseSaved(p.english) && !phraseNeedsTranslation(p));
    all.textContent = done ? "✓ すべて保存済み" : "まとめて保存";
    all.classList.toggle("saved", done); all.disabled = done;
  }
  refreshPhraseBookBadges();
}

    +   '<button id="newPdfBtn" class="btn btn-ghost" style="margin-top:10px">別のPDFで練習する</button></div>'
    + '</div>';

  const rs = $("reSummaryBtn"); if (rs) rs.addEventListener("click", genSummary);
  document.querySelectorAll(".phraseSpeak").forEach(b => b.addEventListener("click", () => {
    const p = S.summary && S.summary.phrases && S.summary.phrases[Number(b.getAttribute("data-p"))];
    if (p) speak(p.english);
  }));
  document.querySelectorAll(".phraseSave").forEach(b => b.addEventListener("click", () => {
    const p = S.summary && S.summary.phrases && S.summary.phrases[Number(b.getAttribute("data-p"))];
    if (p) savePhraseToBook(p, { sourceTitle:S.digest && S.digest.title, scenario:S.scenario });
    syncSummaryPhraseControls();
  }));
  const saveAll = $("saveAllPhrases");
  if (saveAll) saveAll.addEventListener("click", () => { saveSummaryPhrases(sm.phrases); syncSummaryPhraseControls(); });
  bindPhraseBookButton();
  $("againBtn").addEventListener("click", () => { S.msgs = []; S.summary = null; setStage("setup"); });
  $("newPdfBtn").addEventListener("click", resetAll);
}

// ── boot ──
render();
boot();
</script>
</body>
</html>
